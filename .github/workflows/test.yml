name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same check as Release — fail PR in seconds if Xcode Resources are broken
      - name: Verify macOS bundle resources
        run: bash scripts/build/verify-macos-resources.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit and component tests
        run: npm test -- --ci --forceExit
