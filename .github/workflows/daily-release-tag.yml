name: Daily release tag

# Batches main into at most one date tag per Asia/Jakarta day.
# This workflow ONLY pushes the tag. The Release workflow (on: push tags)
# builds artifacts and creates GitHub Releases (source + gump-desktop-releases).
#
# Tag push must use RELEASE_BOT_TOKEN (PAT). GITHUB_TOKEN tag pushes do not
# trigger other workflows.

on:
  schedule:
    # 23:59 Asia/Jakarta (WIB, UTC+7) = 16:59 UTC
    - cron: '59 16 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Tag date YYYY-MM-DD (default: today WIB)'
        required: false
        default: ''
      force:
        description: 'Create tag even if no meaningful commits that day'
        type: boolean
        default: false
      dry_run:
        description: 'Print plan only; do not create/push tag'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  create-tag:
    name: Create daily tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create daily release tag
        env:
          # PAT so the tag push triggers workflow Release (GITHUB_TOKEN cannot).
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          TAG_DATE: ${{ github.event.inputs.date || '' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -z "${RELEASE_BOT_TOKEN}" ]]; then
            echo "::error::RELEASE_BOT_TOKEN is required so Daily release tag can trigger the Release workflow"
            exit 1
          fi
          chmod +x scripts/create-daily-release-tag.sh scripts/generate-release-notes.sh
          bash scripts/create-daily-release-tag.sh
