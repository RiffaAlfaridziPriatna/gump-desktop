name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., 2026-09-15). Empty = today UTC.'
        required: false
        default: ''
  push:
    tags:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Install CocoaPods
        run: |
          cd macos
          LANG=en_US.UTF-8 pod install

      - name: Read version
        id: version
        run: |
          VERSION=$(tr -d '\n\r' < VERSION.macos)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=Gump-MacOS-v${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm -f certificate.p12

      - name: Build, sign, notarize
        env:
          GUMP_ENV: prod
          MACOS_CODESIGN_IDENTITY: 'Developer ID Application: Gump Ai Limited (FWQ2YTUNN4)'
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run build:macos:distribute

      - name: Sign zip for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz"
          mkdir -p tools/sparkle
          tar -xf sparkle.tar.xz -C tools/sparkle
          SIGN_UPDATE="$(find tools/sparkle -type f -name sign_update | head -n 1)"
          if [[ -z "$SIGN_UPDATE" ]]; then
            echo "sign_update not found in Sparkle archive" >&2
            exit 1
          fi
          ZIP_PATH="dist/prod/macos/${{ steps.version.outputs.artifact_name }}"
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_key
          SIGNATURE="$("$SIGN_UPDATE" --ed-key-file /tmp/sparkle_key "$ZIP_PATH" | tr -d '\n')"
          rm -f /tmp/sparkle_key
          printf '%s\n' "$SIGNATURE" > dist/prod/macos/sparkle_signature.txt
          echo "Sparkle signature: $SIGNATURE"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/prod/macos/${{ steps.version.outputs.artifact_name }}
            dist/prod/macos/sparkle_signature.txt
          retention-days: 7

  build-windows:
    name: Build Windows
    # Pin to windows-2022: RNW 0.81 looks for VS [17.11, 18.0).
    # windows-latest (2025) ships VS 2026 only → same NoMSBuild failure as windows-build.yml.
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(tr -d '\n\r' < VERSION.windows)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=Gump-Windows-v${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Build Windows portable zip
        env:
          GUMP_ENV: prod
        run: npm run build:windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/prod/windows/${{ steps.version.outputs.artifact_name }}
          retention-days: 7

  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="$(date -u +%Y-%m-%d)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: dist/prod/macos/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/prod/windows/

      - name: Generate appcast.xml
        env:
          GITHUB_RELEASES_REPO: ${{ github.repository }}
        run: node scripts/generate-appcast.mjs --tag "${{ steps.tag.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          MAC_VERSION="$(tr -d '\n\r' < VERSION.macos)"
          WIN_VERSION="$(tr -d '\n\r' < VERSION.windows)"
          NOTES="$(printf '## Versions\n\n- **macOS**: v%s\n- **Windows**: v%s\n\n---\n*Auto-generated release*' "$MAC_VERSION" "$WIN_VERSION")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading assets"
          else
            gh release create "$TAG" --title "Release $TAG" --notes "$NOTES"
          fi

          gh release upload "$TAG" \
            "dist/prod/macos/Gump-MacOS-v${MAC_VERSION}.zip" \
            "dist/prod/windows/Gump-Windows-v${WIN_VERSION}.zip" \
            --clobber

      - name: Update appcast.xml on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp dist/appcast.xml appcast.xml
          git add appcast.xml
          if git diff --staged --quiet; then
            echo "appcast.xml unchanged"
          else
            git commit -m "chore: update appcast.xml for ${TAG}"
            git push origin main
          fi

      - name: Summary
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          {
            echo "## Release Complete"
            echo ""
            echo "- **Tag**: $TAG"
            echo "- **macOS**: v$(tr -d '\n\r' < VERSION.macos)"
            echo "- **Windows**: v$(tr -d '\n\r' < VERSION.windows)"
            echo ""
            echo "**Links:**"
            echo "- [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/$TAG)"
            echo "- [Appcast URL](https://raw.githubusercontent.com/${{ github.repository }}/main/appcast.xml)"
          } >> "$GITHUB_STEP_SUMMARY"
